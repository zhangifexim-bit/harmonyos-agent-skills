name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PUBLICATION_CANDIDATE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name != 'pull_request' && github.sha) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python scripts
        run: python -m py_compile scripts/validate_skills.py scripts/validate_reliability.py scripts/run_behavioral_evals.py scripts/scan_private_markers.py scripts/scan_git_metadata.py

      - name: Validate skills and local Markdown links
        run: python scripts/validate_skills.py

      - name: Run deterministic reliability contracts
        run: python scripts/validate_reliability.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run generic privacy scan
        run: python scripts/scan_private_markers.py --generic-only

      - name: Audit Git metadata and reachable refs
        run: python scripts/scan_git_metadata.py

      - name: Enforce publication identity on main tip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/scan_git_metadata.py --publication-policy policies/publication-identity.json --candidate-ref HEAD

      - name: Fetch canonical annotated tag object
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $publicationRef = "refs/publication-tags/$env:GITHUB_REF_NAME"
          git fetch --force origin "refs/tags/$env:GITHUB_REF_NAME`:$publicationRef"
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch the canonical publication tag." }
          $objectType = git cat-file -t $publicationRef
          if ($LASTEXITCODE -ne 0 -or $objectType -ne 'tag') {
            throw "The canonical publication ref is not an annotated tag."
          }

      - name: Enforce publication identity on annotated tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: python scripts/scan_git_metadata.py --publication-policy policies/publication-identity.json --candidate-ref HEAD --tag-ref "refs/publication-tags/$env:GITHUB_REF_NAME"

      - name: Validate optional live eval harness without agent calls
        run: python scripts/run_behavioral_evals.py --case build-001-node-missing

      - name: Parse and execute read-only PowerShell probe
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/check-deveco-env.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $result = & ./scripts/check-deveco-env.ps1 -ProjectPath . -Json | ConvertFrom-Json
          if ($result.Count -ne 7) { throw "Expected seven component results." }

      - name: Parse safe installer
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'install.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Verify installer dependency closure
        shell: pwsh
        run: |
          $preview = & ./install.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'skills') -Skill harmonyos-release-check -WhatIf *>&1 | Out-String
          if ($preview -notmatch 'harmonyos-release-signing' -or $preview -notmatch 'harmonyos-release-check') {
            throw 'Release Check dependency closure was not resolved.'
          }

      - name: Check whitespace
        run: git diff --check HEAD
