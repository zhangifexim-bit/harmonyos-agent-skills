name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python scripts
        run: python -m py_compile scripts/validate_skills.py scripts/scan_private_markers.py

      - name: Validate skills and local Markdown links
        run: python scripts/validate_skills.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run generic privacy scan
        run: python scripts/scan_private_markers.py --generic-only

      - name: Parse and execute read-only PowerShell probe
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/check-deveco-env.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $result = & ./scripts/check-deveco-env.ps1 -ProjectPath . -Json | ConvertFrom-Json
          if ($result.Count -ne 7) { throw "Expected seven component results." }

      - name: Check whitespace
        run: git diff --check HEAD
